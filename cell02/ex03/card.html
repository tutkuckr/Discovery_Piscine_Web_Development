<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Profile Card</title>
  <link rel="stylesheet" href="card.css">
</head>
<body>

  <div class="profile-card">
    <div class="profile-title">My Profile</div>
    <div class="invisible-table">
      <div class="invisible-row">
        <div class="invisible-cell">
          <img class="profile-pic" src="./img.jpg" alt="Profile Picture">
          <div class="login">tcakir-y</div>
          <div class="description">Level 25 <br> Codam </div>
        </div>
      </div>
    </div>

    <div class="social-icons">
		<a href="https://www.linkedin.com/feed/"> <img src="https://cdn-icons-png.flaticon.com/512/174/174857.png" alt="LinkedIn"></a>
		<a href="https://x.com/"><img src="https://cdn-icons-png.flaticon.com/512/733/733579.png" alt="Twitter"></a>
    </div>
    <button class="contact-button">Contact</button>
  </div>
</body>
</html>
