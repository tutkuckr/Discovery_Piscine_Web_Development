<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="parallax.css">
	<title>Parallax</title>
</head>

<body>

	<div class="parallax-container">
		<div class="parallax img1"> 
		  <p class="text1">Hello</p>
		</div>
	  
		<div class="separator">SEPARATOR</div>
	  
		<div class="parallax img2">
		  <p class="text2">World</p>
		</div>
	  </div>
</body>
</html>

<!-- 
General Logic
[ img1 stuck to background with text on top ]  <-- parallax effect
[ some scrollable section, like a pink block ]
[ img2 stuck to background with text on top ]  <-- parallax again
-->
