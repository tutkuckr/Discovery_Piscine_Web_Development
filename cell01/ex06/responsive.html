<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<style>
		html, body {
			height: 60%;
			margin: 0;
		}
		table {
			width: 100%;
			height: 100%;
			border-collapse: collapse;
		}
		table td {
			border: 1px solid black;
		}
		td:first-child {
			background-color: blueviolet;
		}
		td:last-child {
			background-color: chocolate;
		}
	</style>
</head>
<body>
	<table>
		<tr">
			<td>HELLO</td>
			<td>WORLD</td>
		</tr>
	</table>
</body>
</html>
