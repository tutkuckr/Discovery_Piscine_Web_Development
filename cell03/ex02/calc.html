<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Calculator</title>
		<style>
			body 
			{
				display: flex;
				justify-content: center;
				align-items: center;
				height: 100vh; /* Full viewport height */
				margin: 0;
			}
			.calculator {
				position: absolute;
				top: 50%;
				left: 50%;
				transform: translate(-50%, -50%);
				width: 300px;
				height: 400px;
				background: #eee;
				padding: 20px;
				border-radius: 10px;
			}
			button
			{

			}
		</style>
	</head>
	<body>
		<div class="calculator">
			<center>
				<table class="buttons">
					<tr>
						<td><button>1</button></td>
						<td><button>2</button></td>
						<td><button>3</button></td>
						<td><button>-</button></td>
					</tr>
					<tr>
						<td><button>4</button></td>
						<td><button>5</button></td>
						<td><button>6</button></td>
						<td><button>*</button></td>
					</tr>
					<tr>
						<td><button>7</button></td>
						<td><button>8</button></td>
						<td><button>9</button></td>
						<td><button>/</button></td>
					</tr>
					<tr>
						<td><button>+</button></td>
						<td><button>=</button></td>
						<td><button>0</button></td>
						<td><button>%</button></td>
					</tr>
				</table>
			</center>
		</div>
	</body>
</html>
